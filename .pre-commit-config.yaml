repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
        args: [--allow-multiple-documents]
    -   id: check-added-large-files
    -   id: mixed-line-ending

-   repo: local
    hooks:
    # Ruff is the single linter (incl. pyupgrade's UP rules) and formatter. It runs
    # from uv.lock so hooks, local-ci and CI share one version; --force-exclude
    # applies the pyproject exclusions to the filenames pre-commit passes.
    -   id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true
    -   id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
    -   id: test-hygiene
        name: test-hygiene
        entry: scripts/ci/check_test_hygiene.py
        language: python
        pass_filenames: true
        files: ^tests/.*\.py$
    -   id: legacy-test-triage
        name: legacy-test-triage
        entry: uv run python scripts/ci/check_legacy_test_triage.py
        language: system
        pass_filenames: false
        # Change-gated: reads only tests/** (markers + tests/_triage manifest).
        files: ^tests/
    -   id: naming-check
        name: naming-standards
        entry: uv run python scripts/agents/naming_inventory.py --strict --quiet
        language: system
        pass_filenames: false
        # Change-gated to the configured scan_paths in
        # config/agents/naming_patterns.yaml (src, tests, scripts, config).
        files: ^(src/|tests/|scripts/|config/)
