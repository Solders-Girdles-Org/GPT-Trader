name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: CI Change Classifier
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      dependencies: ${{ steps.classify.outputs.dependencies }}
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          emit_outputs() {
            echo "dependencies=$1" >> "$GITHUB_OUTPUT"
          }

          emit_all_true() {
            emit_outputs true
          }

          EVENT_NAME="${{ github.event_name }}"
          BASE_SHA=""
          HEAD_SHA="$GITHUB_SHA"

          case "$EVENT_NAME" in
            pull_request)
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
              HEAD_SHA="${{ github.event.pull_request.head.sha }}"
              ;;
            merge_group)
              echo "Merge-group event; running all conditional checks."
              emit_all_true
              exit 0
              ;;
            push)
              BASE_SHA="${{ github.event.before }}"
              HEAD_SHA="${{ github.event.after }}"
              ;;
            *)
              echo "Workflow dispatch or unknown event; running all conditional checks."
              emit_all_true
              exit 0
              ;;
          esac

          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "Could not determine a stable diff range; running all conditional checks."
            emit_all_true
            exit 0
          fi

          DIFF_BASE_SHA="$BASE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! DIFF_BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA"); then
              echo "::warning::Could not compute merge-base for $BASE_SHA and $HEAD_SHA; running all conditional checks."
              emit_all_true
              exit 0
            fi
            if [ -z "$DIFF_BASE_SHA" ]; then
              echo "::warning::Merge-base for $BASE_SHA and $HEAD_SHA was empty; running all conditional checks."
              emit_all_true
              exit 0
            fi
          fi

          # Disable rename detection so moved guarded inputs classify by source path too.
          if ! changed_files=$(git diff --name-only --no-renames "$DIFF_BASE_SHA" "$HEAD_SHA"); then
            echo "::warning::Could not diff $DIFF_BASE_SHA..$HEAD_SHA; running all conditional checks."
            emit_all_true
            exit 0
          fi

          dependencies=false

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              .github/workflows/ci.yml)
                dependencies=true
                ;;
              .github/workflows/uv_lock_upgrade.yml|.github/dependabot.yml|pyproject.toml|uv.lock|requirements*.txt|*/requirements*.txt|requirements*.in|*/requirements*.in|constraints*.txt|*/constraints*.txt|constraints*.in|*/constraints*.in|Dockerfile|*/Dockerfile)
                dependencies=true
                ;;
            esac
          done <<< "$changed_files"

          emit_outputs "$dependencies"

          {
            echo "## CI Change Classifier"
            echo ""
            echo "- Dependency review: $dependencies"
            echo ""
            echo "Changed files:"
            echo '```'
            printf '%s\n' "$changed_files" | sed -n '1,120p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install uv
        # astral-sh/setup-uv@v7
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Set up Python
        # actions/setup-python@v5
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Lint (Ruff - critical scripts)
        run: uv run ruff check scripts/ops scripts/ci scripts/analysis/backtest_runner.py scripts/monitoring scripts/production_preflight.py

      - name: Format (Black)
        run: uv run black --check .

      - name: Guard against orchestration imports (removed in v3.0)
        run: python scripts/ci/check_orchestration_imports.py

      - name: Guard deprecation registry
        run: python scripts/ci/check_deprecation_registry.py

  docs-audit:
    name: Docs Link Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install uv
        # astral-sh/setup-uv@v7
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Set up Python
        # actions/setup-python@v5
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run markdown link audit
        run: |
          set -o pipefail
          mkdir -p var/ci/docs_audit
          python scripts/maintenance/docs_link_audit.py 2>&1 | tee var/ci/docs_audit/docs_link_audit.log

      - name: Check docs reachability
        run: |
          set -o pipefail
          mkdir -p var/ci/docs_audit
          python scripts/maintenance/docs_reachability_check.py 2>&1 | tee var/ci/docs_audit/docs_reachability.log

      - name: Gate docs currency (missing/stale)
        run: |
          set -o pipefail
          mkdir -p var/ci/docs_audit
          uv run python scripts/maintenance/docs_currency_scan.py \
            --fail-on missing,stale \
            --output var/ci/docs_audit/docs_currency_report.md \
            2>&1 | tee var/ci/docs_audit/docs_currency.log

      - name: Docs audit summary
        if: always()
        run: |
          {
            if [ "${{ job.status }}" = "success" ]; then
              echo "Docs audit OK"
            else
              echo "Docs audit failed."
              for file in var/ci/docs_audit/docs_link_audit.log var/ci/docs_audit/docs_reachability.log var/ci/docs_audit/docs_currency.log; do
                if [ -f "$file" ]; then
                  echo ""
                  echo "### $(basename "$file") (first 40 lines)"
                  echo '```'
                  sed -n '1,40p' "$file"
                  echo '```'
                else
                  echo ""
                  echo "Log not found: $file"
                fi
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install uv
        # astral-sh/setup-uv@v7
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Set up Python
        # actions/setup-python@v5
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Type Check (MyPy)
        run: uv run mypy src

  test-guardrails:
    name: Test Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install uv
        # astral-sh/setup-uv@v7
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Set up Python
        # actions/setup-python@v5
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check test hygiene
        run: uv run python scripts/ci/check_test_hygiene.py

      - name: Check legacy patterns
        run: uv run python scripts/ci/check_legacy_patterns.py

      - name: Check import boundaries
        run: uv run python scripts/ci/check_import_boundaries.py

      - name: Check legacy triage alignment
        run: uv run python scripts/ci/check_legacy_test_triage.py

      - name: Check triage backlog
        run: make test-triage-check

  unit-tests:
    name: Unit Tests (Core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GPT_TRADER_STRICT_CONTAINER: "1"
      PYTHONWARNINGS: default
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install uv
        # astral-sh/setup-uv@v7
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Set up Python
        # actions/setup-python@v5
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run unit tests
        # Report path must be absolute (some tests change the process cwd) and
        # outside the repo root (tests/conftest.py pytest_sessionfinish runs
        # cleanup_workspace.py --apply, which deletes a root-level coverage.json).
        run: uv run pytest tests/unit -n auto -q --cov=src/gpt_trader --cov-report="json:$PWD/var/results/coverage/coverage.json"

      - name: Stage 1 rails end-to-end smoke
        # Offline operator-lifecycle smoke: unit tests cover the parts, this
        # covers the loop (propose -> approve -> ticket -> fill -> closeout ->
        # audit verify) through the real CLI. No network or credentials.
        run: uv run python scripts/ops/stage1_rails_smoke.py

      - name: Upload coverage artifact
        if: always()
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-json
          path: var/results/coverage/coverage.json
          retention-days: 30
          if-no-files-found: ignore

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GPT_TRADER_STRICT_CONTAINER: "1"
      PYTHONWARNINGS: default
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install uv
        # astral-sh/setup-uv@v7
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Set up Python
        # actions/setup-python@v5
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Mock-broker suite: tests/integration/conftest.py forces MOCK_BROKER=1,
      # so this needs no secrets. Advisory lane (not branch-protection required).
      - name: Run integration tests
        run: uv run pytest -o addopts= -m "integration and not slow and not real_api" tests/integration -q

  windows-unit-tests:
    name: Windows Unit Tests (Portability)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GPT_TRADER_STRICT_CONTAINER: "1"
      PYTHONWARNINGS: default
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install uv
        # astral-sh/setup-uv@v7
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Set up Python
        # actions/setup-python@v5
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Windows-sensitive unit tests
        run: uv run pytest tests/unit/gpt_trader/persistence tests/unit/gpt_trader/monitoring tests/unit/scripts -q

  property-tests:
    name: Property Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GPT_TRADER_STRICT_CONTAINER: "1"
      PYTHONWARNINGS: default
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install uv
        # astral-sh/setup-uv@v7
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Set up Python
        # actions/setup-python@v5
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run property tests
        run: uv run pytest tests/property -v

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GPT_TRADER_STRICT_CONTAINER: "1"
      PYTHONWARNINGS: default
    steps:
      # actions/checkout@v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install uv
        # astral-sh/setup-uv@v7
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Set up Python
        # actions/setup-python@v5
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run contract tests
        run: uv run pytest tests/contract -v

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: always()
    needs: changes
    steps:
      - name: Fail when change classifier did not succeed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::CI Change Classifier ended with result '${{ needs.changes.result }}'; failing closed."
          exit 1

      - name: Skip dependency audit
        if: needs.changes.result == 'success' && needs.changes.outputs.dependencies != 'true'
        run: |
          echo "Dependency manifests did not change; skipping dependency audit."
          {
            echo "## Dependency Vulnerability Audit"
            echo "Status: SKIPPED (no dependency manifest inputs changed)"
          } >> "$GITHUB_STEP_SUMMARY"

      # actions/checkout@v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        if: needs.changes.result == 'success' && needs.changes.outputs.dependencies == 'true'
        with:
          persist-credentials: false

      - name: Install uv
        # astral-sh/setup-uv@v7
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        if: needs.changes.result == 'success' && needs.changes.outputs.dependencies == 'true'
        with:
          enable-cache: true

      - name: Set up Python
        # actions/setup-python@v5
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        if: needs.changes.result == 'success' && needs.changes.outputs.dependencies == 'true'
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        if: needs.changes.result == 'success' && needs.changes.outputs.dependencies == 'true'
        run: uv sync --all-extras --dev

      - name: Export locked requirements
        if: needs.changes.result == 'success' && needs.changes.outputs.dependencies == 'true'
        run: uv export --frozen --all-extras --no-emit-project --no-hashes -o requirements-audit.txt

      - name: Audit dependencies (pip-audit)
        if: needs.changes.result == 'success' && needs.changes.outputs.dependencies == 'true'
        # --no-deps: the uv export is already a complete pinned closure
        run: uv run pip-audit -r requirements-audit.txt --disable-pip --no-deps --strict

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    needs: changes
    steps:
      - name: Fail when change classifier did not succeed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::CI Change Classifier ended with result '${{ needs.changes.result }}'; failing closed."
          exit 1

      - name: Skip dependency review
        if: needs.changes.result == 'success' && needs.changes.outputs.dependencies != 'true'
        run: |
          echo "Dependency manifests did not change; skipping dependency review."
          {
            echo "## Dependency Review"
            echo "Status: SKIPPED (no dependency manifest inputs changed)"
          } >> "$GITHUB_STEP_SUMMARY"

      # actions/checkout@v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        if: needs.changes.result == 'success' && needs.changes.outputs.dependencies == 'true'
        with:
          persist-credentials: false

      - name: Review dependencies
        if: needs.changes.result == 'success' && needs.changes.outputs.dependencies == 'true'
        # actions/dependency-review-action@v5.0.0
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
