name: Trading trigger

# Applies reserved item (e) from main's code and posts the required
# `trading-trigger/base` commit status (scripts/ci/trading_trigger_status.py).
# `workflow_run` runs this file as main has it, whatever the PR changed. The
# `Trading trigger request` run that starts it is the PR's own copy, so take
# only GitHub's record of that run (event, commit, branch, PR number) and
# never its files, outputs or artifacts. Never fetch, check out or run the
# PR's head here, and use no third-party actions.
#
# The status is posted as the GitHub App whose key is in the `trading-trigger`
# environment (deployment branches: main only), so a workflow a PR adds can't
# post it. Until that App is set up, it falls back to this job's token.
on:
  workflow_run:
    workflows: [Trading trigger request]
    types: [requested]

permissions: {}

concurrency:
  # One run at a time per PR branch or queue entry, so an older body's verdict can't land last.
  group: trading-trigger-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  judge:
    name: Trading trigger (base branch)
    if: >-
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: trading-trigger
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Fetch main only
        env:
          REPO: ${{ github.repository }}
          # workflow_run: the latest commit on main, which this file came from.
          BASE_SHA: ${{ github.sha }}
        run: |
          git init -q base
          git -C base fetch -q --depth 1 --no-tags "https://github.com/$REPO" "$BASE_SHA"
          git -C base checkout -q FETCH_HEAD
          git -C base log -1 --format='Judging with base commit %H'
      - name: Judge the PR and post the status
        working-directory: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          STATUS_APP_ID: ${{ vars.TRADING_TRIGGER_APP_ID }}
          STATUS_APP_KEY: ${{ secrets.TRADING_TRIGGER_APP_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RUN_EVENT" = merge_group ]; then
            python3 -I -S scripts/ci/trading_trigger_status.py --repo "$REPO" \
              --merge-group-ref "$RUN_HEAD_BRANCH" --status-sha "$RUN_HEAD_SHA" --target-url "$RUN_URL"
          else
            python3 -I -S scripts/ci/trading_trigger_status.py --repo "$REPO" \
              --pr "${RUN_PR:-0}" --expected-head "$RUN_HEAD_SHA" --target-url "$RUN_URL"
          fi
