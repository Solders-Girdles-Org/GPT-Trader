name: Integration Tests (Manual)

on:
  workflow_dispatch:

jobs:
  integration:
    name: Integration Suite (Mock Broker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GPT_TRADER_STRICT_CONTAINER: "1"
      PYTHONWARNINGS: default

    steps:
      # actions/checkout@v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        # astral-sh/setup-uv@v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          prune-cache: true  # Preserve the pre-v9 cache policy.

      - name: Set up Python
        # actions/setup-python@v6
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Full integration suite including slow tests. The suite runs against
      # DeterministicBroker (tests/integration/conftest.py forces MOCK_BROKER=1),
      # so no Coinbase secrets or deployment environment are needed. The fast
      # subset (not slow) also runs on every PR via ci.yml.
      - name: Run integration tests
        run: uv run pytest -o addopts= -m "integration and not real_api" tests/integration -v
